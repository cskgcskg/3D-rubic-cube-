<!DOCTYPE html>

<head>

    <style>
        :root {

            left: 0;

            z-index: 0;

            align-items: center;

    <script>
        // ─── Three.js scene ───────────────────────────────────────────────────────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.prepend(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const kl = new THREE.DirectionalLight(0xffffff, 0.7); kl.position.set(6, 10, 8); scene.add(kl);
        const fl = new THREE.DirectionalLight(0x8899cc, 0.3); fl.position.set(-8, 3, -5); scene.add(fl);
        const pl = new THREE.PointLight(0x6c5ce7, 0.4, 30); pl.position.set(0, -5, 10); scene.add(pl);

        // ─── Megaminx math ────────────────────────────────────────────────────────
        const PHI = (1 + Math.sqrt(5)) / 2;
        const ANIM_DUR = 280;
        const SCRAMBLE_DUR = 70;
        const SOLVE_DUR = 100;

        // 12 face normals of a regular dodecahedron (from icosahedron vertices, normalized)
        const FACE_NORMALS = [
            new THREE.Vector3(0.000000, -0.850651, -0.525731),
            new THREE.Vector3(-0.850651, -0.525731, 0.000000),
            new THREE.Vector3(-0.525731, 0.000000, -0.850651),
            new THREE.Vector3(0.000000, -0.850651, 0.525731),
            new THREE.Vector3(-0.850651, 0.525731, 0.000000),
            new THREE.Vector3(0.525731, 0.000000, -0.850651),
            new THREE.Vector3(0.000000, 0.850651, -0.525731),
            new THREE.Vector3(0.850651, -0.525731, 0.000000),
            new THREE.Vector3(-0.525731, 0.000000, 0.850651),
            new THREE.Vector3(0.000000, 0.850651, 0.525731),
            new THREE.Vector3(0.850651, 0.525731, 0.000000),
            new THREE.Vector3(0.525731, 0.000000, 0.850651),
        ];

        // 12 megaminx face colors
        const FACE_COLORS = [
            0xffffff, 0xcccccc, 0x009b48, 0x0046ad,
            0xb71234, 0xff5800, 0xffd500, 0x9900cc,
            0xff69b4, 0x00cc44, 0x00dddd, 0x8b4513
        ];

        const FACE_NAMES = ['U', 'D', 'F', 'B', 'L', 'R', 'FL', 'FR', 'BL', 'BR', 'DL', 'DR'];

        // ─── Build ideal positions: 20 corners + 30 edges + 12 centers = 62 pieces ─
        const PIECE_SCALE = 1.02; // Minimal gaps between pieces
        const idealPositions = [
            new THREE.Vector3(-1.000000, -1.000000, -1.000000),
            new THREE.Vector3(-1.000000, -1.000000, 1.000000),
            new THREE.Vector3(-1.000000, 1.000000, -1.000000),
            new THREE.Vector3(-1.000000, 1.000000, 1.000000),
            new THREE.Vector3(1.000000, -1.000000, -1.000000),
            new THREE.Vector3(1.000000, -1.000000, 1.000000),
            new THREE.Vector3(1.000000, 1.000000, -1.000000),
            new THREE.Vector3(1.000000, 1.000000, 1.000000),
            new THREE.Vector3(0.000000, -0.618034, -1.618034),
            new THREE.Vector3(-0.618034, -1.618034, 0.000000),
            new THREE.Vector3(-1.618034, 0.000000, -0.618034),
            new THREE.Vector3(0.000000, -0.618034, 1.618034),
            new THREE.Vector3(-0.618034, 1.618034, 0.000000),
            new THREE.Vector3(1.618034, 0.000000, -0.618034),
            new THREE.Vector3(0.000000, 0.618034, -1.618034),
            new THREE.Vector3(0.618034, -1.618034, 0.000000),
            new THREE.Vector3(-1.618034, 0.000000, 0.618034),
            new THREE.Vector3(0.000000, 0.618034, 1.618034),
            new THREE.Vector3(0.618034, 1.618034, 0.000000),
            new THREE.Vector3(1.618034, 0.000000, 0.618034),
            new THREE.Vector3(-0.500000, -0.809017, -1.309017),
            new THREE.Vector3(-0.809017, -1.309017, -0.500000),
            new THREE.Vector3(-1.309017, -0.500000, -0.809017),
            new THREE.Vector3(-0.809017, -1.309017, 0.500000),
            new THREE.Vector3(-0.500000, -0.809017, 1.309017),
            new THREE.Vector3(-1.309017, -0.500000, 0.809017),
            new THREE.Vector3(-1.309017, 0.500000, -0.809017),
            new THREE.Vector3(-0.809017, 1.309017, -0.500000),
            new THREE.Vector3(-0.500000, 0.809017, -1.309017),
            new THREE.Vector3(-0.809017, 1.309017, 0.500000),
            new THREE.Vector3(-1.309017, 0.500000, 0.809017),
            new THREE.Vector3(-0.500000, 0.809017, 1.309017),
            new THREE.Vector3(0.500000, -0.809017, -1.309017),
            new THREE.Vector3(1.309017, -0.500000, -0.809017),
            new THREE.Vector3(0.809017, -1.309017, -0.500000),
            new THREE.Vector3(0.500000, -0.809017, 1.309017),
            new THREE.Vector3(0.809017, -1.309017, 0.500000),
            new THREE.Vector3(1.309017, -0.500000, 0.809017),
            new THREE.Vector3(1.309017, 0.500000, -0.809017),
            new THREE.Vector3(0.500000, 0.809017, -1.309017),
            new THREE.Vector3(0.809017, 1.309017, -0.500000),
            new THREE.Vector3(0.500000, 0.809017, 1.309017),
            new THREE.Vector3(0.809017, 1.309017, 0.500000),
            new THREE.Vector3(1.309017, 0.500000, 0.809017),
            new THREE.Vector3(0.000000, 0.000000, -1.618034),
            new THREE.Vector3(0.000000, -1.618034, 0.000000),
            new THREE.Vector3(-1.618034, 0.000000, 0.000000),
            new THREE.Vector3(0.000000, 0.000000, 1.618034),
            new THREE.Vector3(0.000000, 1.618034, 0.000000),
            new THREE.Vector3(1.618034, 0.000000, 0.000000),
            new THREE.Vector3(0.000000, -1.170820, -0.723607),
            new THREE.Vector3(-1.170820, -0.723607, 0.000000),
            new THREE.Vector3(-0.723607, 0.000000, -1.170820),
            new THREE.Vector3(0.000000, -1.170820, 0.723607),
            new THREE.Vector3(-1.170820, 0.723607, 0.000000),
            new THREE.Vector3(0.723607, 0.000000, -1.170820),
            new THREE.Vector3(0.000000, 1.170820, -0.723607),
            new THREE.Vector3(1.170820, -0.723607, 0.000000),
            new THREE.Vector3(-0.723607, 0.000000, 1.170820),
            new THREE.Vector3(0.000000, 1.170820, 0.723607),
            new THREE.Vector3(1.170820, 0.723607, 0.000000),
            new THREE.Vector3(0.723607, 0.000000, 1.170820),
        ].map(p => p.multiplyScalar(PIECE_SCALE));

        // For each ideal position, determine which faces it belongs to
        const FACE_THRESHOLD = 0.75; // Safe threshold for normal dot product (corners are 0.7946)
        function getPositionFaces(pos) {
            const faces = [];
            for (let fi = 0; fi < 12; fi++) {
                if (pos.clone().normalize().dot(FACE_NORMALS[fi]) > FACE_THRESHOLD) faces.push(fi);
            }
            return faces;
        }

        // Snap a position to the nearest ideal position
        function snapToIdeal(pos) {
            let best = idealPositions[0], bestD = Infinity;
            for (const ip of idealPositions) {
                const d = pos.distanceToSquared(ip);
                if (d < bestD) { bestD = d; best = ip; }
            }
            return best;
        }

        // ─── Megaminx class ───────────────────────────────────────────────────────
        class Megaminx {
            constructor() {
                this.group = new THREE.Group();
                scene.add(this.group);

                this.cubies = [];
                this.isAnimating = false;
                this.moveHistory = [];
                this.moveCount = 0;
                this.timerRunning = false;
                this.timerStart = 0;
                this.timerElapsed = 0;
                this.isScrambled = false;
                this.solving = false;
            }

            build() {
                // Remove old
                while (this.group.children.length) this.group.remove(this.group.children[0]);
                this.cubies = [];

                // ── Extract pentagonal face data from the DodecahedronGeometry ──
                // The geometry is triangulated; group triangles by shared normal
                // to reconstruct each pentagonal face with its vertices.
                const refDodec = new THREE.DodecahedronGeometry(0.42);
                const dodecPos = refDodec.attributes.position;

                const faceGroups = []; // { normal, vertices: [Vector3] }
                for (let i = 0; i < dodecPos.count; i += 3) {
                    const a = new THREE.Vector3().fromBufferAttribute(dodecPos, i);
                    const b = new THREE.Vector3().fromBufferAttribute(dodecPos, i + 1);
                    const c = new THREE.Vector3().fromBufferAttribute(dodecPos, i + 2);
                    const triCenter = a.clone().add(b).add(c).divideScalar(3);
                    const faceN = new THREE.Vector3().crossVectors(
                        b.clone().sub(a), c.clone().sub(a)
                    ).normalize();
                    if (faceN.dot(triCenter) < 0) faceN.negate();

                    // Find or create face group for this normal direction
                    let group = null;
                    for (const fg of faceGroups) {
                        if (fg.normal.dot(faceN) > 0.99) { group = fg; break; }
                    }
                    if (!group) {
                        group = { normal: faceN, vertices: [] };
                        faceGroups.push(group);
                    }
                    group.vertices.push(a, b, c);
                }

                // For each face group, deduplicate vertices and compute orientation
                const dodecFaces = faceGroups.map(fg => {
                    // Deduplicate vertices
                    const unique = [];
                    for (const v of fg.vertices) {
                        let dup = false;
                        for (const u of unique) {
                            if (u.distanceTo(v) < 0.001) { dup = true; break; }
                        }
                        if (!dup) unique.push(v.clone());
                    }

                    // Compute face center
                    const center = new THREE.Vector3();
                    for (const v of unique) center.add(v);
                    center.divideScalar(unique.length);

                    // Direction from center to first vertex = the "point" direction
                    // of the pentagon on this face
                    const pointDir = unique[0].clone().sub(center).normalize();

                    return {
                        normal: fg.normal,
                        center: center,
                        dist: center.length(),
                        pointDir: pointDir // direction from center to a vertex, in face plane
                    };
                });

                // Build a matrix that orients a sticker to sit on the given face:
                //  - local +Z → face normal (sticker faces outward)
                //  - local +X → pointDir (CircleGeometry's first vertex is along +X)
                function buildFaceAlignedMatrix(face) {
                    const n = face.normal.clone().normalize();
                    const px = face.pointDir.clone().normalize();
                    // Ensure px is perfectly orthogonal to n
                    px.sub(n.clone().multiplyScalar(px.dot(n))).normalize();
                    const py = new THREE.Vector3().crossVectors(n, px).normalize();
                    return new THREE.Matrix4().makeBasis(px, py, n);
                }

                function findBestDodecFace(megaNormal) {
                    let best = null, bestDot = -Infinity;
                    for (const df of dodecFaces) {
                        const d = df.normal.dot(megaNormal);
                        if (d > bestDot) { bestDot = d; best = df; }
                    }
                    return best;
                }

                for (const pos of idealPositions) {
                    const piece = new THREE.Group();
                    piece.position.copy(pos);

                    // Black body
                    const bodyGeom = new THREE.DodecahedronGeometry(0.42);
                    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.85, metalness: 0.08 });
                    piece.add(new THREE.Mesh(bodyGeom, bodyMat));

                    // Colored stickers for each face this piece belongs to
                    const faces = getPositionFaces(pos);
                    for (const fi of faces) {
                        const n = FACE_NORMALS[fi];
                        const sticker = new THREE.Mesh(
                            new THREE.CircleGeometry(0.17, 5),
                            new THREE.MeshStandardMaterial({ color: FACE_COLORS[fi], roughness: 0.3, metalness: 0.05, side: THREE.DoubleSide })
                        );

                        // Find the closest dodecahedron face to this megaminx face normal
                        const bestFace = findBestDodecFace(n);
                        const faceNormal = bestFace.normal;
                        const surfaceDist = bestFace.dist;

                        // Build orientation from actual face vertex data so sticker
                        // edges perfectly align with dodecahedron face edges
                        const mat = buildFaceAlignedMatrix(bestFace);
                        sticker.setRotationFromMatrix(mat);

                        // Position on the face surface with tiny offset to prevent z-fighting
                        sticker.position.copy(faceNormal).multiplyScalar(surfaceDist + 0.003);
                        piece.add(sticker);
                    }

                    piece.userData.pos = pos.clone();
                    this.group.add(piece);
                    this.cubies.push(piece);
                }
            }

            getLayer(faceIndex) {
                const n = FACE_NORMALS[faceIndex];
                return this.cubies.filter(c => c.userData.pos.clone().normalize().dot(n) > FACE_THRESHOLD);
            }

            animateMove(faceIndex, dirSign, callback, dur) {
                if (this.isAnimating) return;
                this.isAnimating = true;

                const axis = FACE_NORMALS[faceIndex].clone(); // rotation axis in group-local space
                const layer = this.getLayer(faceIndex);
                const angle = (Math.PI * 2 / 5) * dirSign; // 72 degrees
                const duration = dur || ANIM_DUR;
                const start = performance.now();

                // Store starting transforms for each piece in the layer
                const startData = layer.map(c => ({
                    piece: c,
                    pos: c.position.clone(),
                    quat: c.quaternion.clone()
                }));

                const tick = (now) => {
                    let t = Math.min((now - start) / duration, 1);
                    t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                    const currentAngle = angle * t;
                    const rotQ = new THREE.Quaternion().setFromAxisAngle(axis, currentAngle);

                    for (const sd of startData) {
                        // Rotate position around origin along the axis
                        sd.piece.position.copy(sd.pos).applyQuaternion(rotQ);
                        // Rotate orientation
                        sd.piece.quaternion.copy(rotQ).multiply(sd.quat);
                    }

                    if (t < 1) {
                        requestAnimationFrame(tick);
                    } else {
                        // Snap positions to nearest ideal
                        for (const sd of startData) {
                            const snapped = snapToIdeal(sd.piece.position);
                            sd.piece.position.copy(snapped);
                            sd.piece.userData.pos.copy(snapped);
                        }
                        this.isAnimating = false;
                        if (callback) callback();
                    }
                };
                requestAnimationFrame(tick);
            }

            doFaceMove(name, inv, skipRecord, dur) {
                if (this.isAnimating) return;
                const fi = FACE_NAMES.indexOf(name);
                if (fi < 0) return;
                const d = inv ? -1 : 1;

                if (!this.timerRunning && this.isScrambled && !this.solving) {
                    this.timerRunning = true;
                    this.timerStart = performance.now() - this.timerElapsed;
                }

                this.animateMove(fi, d, () => {
                    if (!skipRecord) {
                        this.moveHistory.push({ fi, d });
                        this.moveCount++;
                        updateUI();
                        addChip(name + (inv ? "'" : ''));
                        this.checkSolved();
                    }
                }, dur);
            }

            doFaceIndex(fi, d, skipRecord, dur) {
                if (this.isAnimating) return;
                if (!this.timerRunning && this.isScrambled && !this.solving) {
                    this.timerRunning = true;
                    this.timerStart = performance.now() - this.timerElapsed;
                }
                this.animateMove(fi, d, () => {
                    if (!skipRecord) {
                        this.moveHistory.push({ fi, d });
                        this.moveCount++;
                        updateUI();
                        addChip(FACE_NAMES[fi] + (d < 0 ? "'" : ''));
                        this.checkSolved();
                    }
                }, dur);
            }

            undoMove() {
                if (this.isAnimating || !this.moveHistory.length || this.solving) return;
                const last = this.moveHistory.pop();
                this.moveCount++;
                this.animateMove(last.fi, -last.d, () => {
                    updateUI(); addChip('undo'); this.checkSolved();
                });
            }

            scramble() {
                if (this.isAnimating || this.solving) return;
                this.reset();
                setTimeout(() => {
                    const COUNT = 25;
                    const moves = [];
                    let prev = -1;
                    for (let i = 0; i < COUNT; i++) {
                        let f; do { f = Math.floor(Math.random() * 12); } while (f === prev);
                        prev = f;
                        moves.push({ fi: f, d: Math.random() > 0.5 ? 1 : -1 });
                    }
                    let i = 0;
                    const next = () => {
                        if (i >= moves.length) { this.isScrambled = true; return; }
                        const m = moves[i++];
                        this.animateMove(m.fi, m.d, () => {
                            this.moveHistory.push({ fi: m.fi, d: m.d });
                            next();
                        }, SCRAMBLE_DUR);
                    };
                    next();
                }, 80);
            }

            solve() {
                if (this.isAnimating || !this.moveHistory.length || this.solving) return;
                this.solving = true;
                this.timerRunning = false;
                document.getElementById('solveBtn').disabled = true;
                document.getElementById('scrambleBtn').disabled = true;

                const rev = [...this.moveHistory].reverse();
                this.moveHistory = [];
                let i = 0;
                const next = () => {
                    if (i >= rev.length) {
                        this.solving = false;
                        this.isScrambled = false;
                        this.moveCount = 0;
                        this.moveHistory = [];
                        updateUI();
                        document.getElementById('historyBar').innerHTML = '';
                        document.getElementById('scrambleBtn').disabled = false;
                        document.getElementById('solveBtn').disabled = false;
                        return;
                    }
                    const m = rev[i++];
                    this.animateMove(m.fi, -m.d, () => { addChip('~'); next(); }, SOLVE_DUR);
                };
                next();
            }

            reset() {
                if (this.isAnimating || this.solving) return;
                this.build();
                this.moveHistory = [];
                this.moveCount = 0;
                this.timerRunning = false;
                this.timerElapsed = 0;
                this.isScrambled = false;
                this.solving = false;
                updateUI();
                updateTimerDisplay(0);
                document.getElementById('historyBar').innerHTML = '';
                document.getElementById('scrambleBtn').disabled = false;
            }

            checkSolved() {
                if (!this.isScrambled || this.solving) return;
                for (let fi = 0; fi < 12; fi++) {
                    const layer = this.getLayer(fi);
                    const colors = new Set();
                    const n = FACE_NORMALS[fi];
                    for (const piece of layer) {
                        for (let si = 1; si < piece.children.length; si++) {
                            const st = piece.children[si];
                            // Get the sticker's world-space normal (it faces along local Z before lookAt)
                            const stickerDir = new THREE.Vector3(0, 0, 1)
                                .applyQuaternion(st.getWorldQuaternion(new THREE.Quaternion()));
                            // Check if this sticker is facing the current face normal (in world space)
                            // Since group has identity transform, world = local
                            if (stickerDir.dot(n) > 0.8) {
                                colors.add(st.material.color.getHex());
                            }
                        }
                    }
                    if (colors.size > 1) return;
                }
                this.timerRunning = false;
                this.isScrambled = false;
                showSolved();
            }
        }

        // ─── Instantiate ──────────────────────────────────────────────────────────
        const cube = new Megaminx();

        // ─── UI ───────────────────────────────────────────────────────────────────
        function updateTimerDisplay(ms) {
            const s = ms / 1000, m = Math.floor(s / 60), sec = Math.floor(s % 60), t = Math.floor((s * 10) % 10);
            document.getElementById('timer').textContent =
                String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0') + '.' + t;
        }
        function updateUI() {
            document.getElementById('moveCounter').textContent = cube.moveCount + ' moves';
        }
        function addChip(l) {
            const b = document.getElementById('historyBar'), e = document.createElement('div');
            e.className = 'history-chip'; e.textContent = l; b.appendChild(e); b.scrollLeft = b.scrollWidth;
        }
        function showSolved() {
            document.getElementById('solvedStats').textContent =
                document.getElementById('timer').textContent + '  ·  ' + cube.moveCount + ' moves';
            document.getElementById('solvedOverlay').classList.add('show');
        }
        function closeSolved() { document.getElementById('solvedOverlay').classList.remove('show'); }

        function scrambleCube() { cube.scramble(); }
        function solveCube() { cube.solve(); }
        function resetCube() { cube.reset(); }
        function undoMove() { cube.undoMove(); }

        // Build move buttons
        (function () {
            const panel = document.getElementById('movesPanel');
            const lbl1 = document.createElement('div'); lbl1.className = 'moves-section-label'; lbl1.textContent = 'Faces'; panel.appendChild(lbl1);
            for (const name of FACE_NAMES) {
                const row = document.createElement('div'); row.className = 'move-pair';
                const b1 = document.createElement('button'); b1.className = 'mbtn'; b1.textContent = name;
                b1.onclick = () => cube.doFaceMove(name, false);
                const b2 = document.createElement('button'); b2.className = 'mbtn'; b2.textContent = name + "'";
                b2.onclick = () => cube.doFaceMove(name, true);
                row.appendChild(b1); row.appendChild(b2); panel.appendChild(row);
            }
        })();

        // ─── Camera ───────────────────────────────────────────────────────────────
        let orbitTheta = Math.PI / 6, orbitPhi = Math.PI / 5, orbitRadius = 12;
        let orbiting = false, orbitPrev = { x: 0, y: 0 };
        function updateCamera() {
            camera.position.set(
                orbitRadius * Math.cos(orbitPhi) * Math.sin(orbitTheta),
                orbitRadius * Math.sin(orbitPhi),
                orbitRadius * Math.cos(orbitPhi) * Math.cos(orbitTheta)
            );
            camera.lookAt(0, 0, 0);
        }
        updateCamera();

        // ─── Pointer interaction ──────────────────────────────────────────────────
        const raycaster = new THREE.Raycaster();
        const mouse2 = new THREE.Vector2();
        let dragState = null;

        function onPointerDown(e) {
            if (cube.isAnimating || cube.solving) return;
            if (e.button === 2 || e.button === 1) { orbiting = true; orbitPrev = { x: e.clientX, y: e.clientY }; return; }
            mouse2.x = (e.clientX / innerWidth) * 2 - 1; mouse2.y = -(e.clientY / innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse2, camera);
            const hits = raycaster.intersectObjects(cube.cubies, true);
            if (hits.length > 0) {
                let h = hits[0].object;
                while (h.parent && !h.userData.pos) h = h.parent;
                if (h.userData.pos) {
                    const fn = hits[0].face
                        ? hits[0].face.normal.clone().applyQuaternion(hits[0].object.getWorldQuaternion(new THREE.Quaternion())).normalize()
                        : h.userData.pos.clone().normalize();
                    dragState = { startX: e.clientX, startY: e.clientY, cubie: h, faceNormal: fn };
                }
            } else {
                orbiting = true; orbitPrev = { x: e.clientX, y: e.clientY };
            }
        }

        function onPointerMove(e) {
            if (orbiting) {
                orbitTheta -= (e.clientX - orbitPrev.x) * 0.005;
                orbitPhi = Math.max(-1.2, Math.min(1.2, orbitPhi + (e.clientY - orbitPrev.y) * 0.005));
                updateCamera(); orbitPrev = { x: e.clientX, y: e.clientY }; return;
            }
            if (!dragState || cube.isAnimating || cube.solving) return;
            const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
            if (Math.sqrt(dx * dx + dy * dy) > 20) {
                const move = determineDrag(dragState.cubie, dragState.faceNormal, dx, dy);
                dragState = null;
                if (move) {
                    cube.doFaceIndex(move.fi, move.d);
                }
            }
        }

        function onPointerUp() { orbiting = false; dragState = null; }

        function determineDrag(cubie, fn, dx, dy) {
            const pos = cubie.userData.pos;
            const m = camera.matrixWorld.elements;
            const camRight = new THREE.Vector3(m[0], m[1], m[2]).normalize();
            const camUp = new THREE.Vector3(m[4], m[5], m[6]).normalize();
            const dragWorld = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();
            const rotVec = new THREE.Vector3().crossVectors(fn, dragWorld).normalize();

            // Find which face this piece belongs to that best aligns with the rotation vector
            const faces = getPositionFaces(pos);
            let bestFi = -1, bestDot = 0;
            for (const fi of faces) {
                const d = rotVec.dot(FACE_NORMALS[fi]);
                if (Math.abs(d) > Math.abs(bestDot)) { bestDot = d; bestFi = fi; }
            }
            if (bestFi >= 0 && Math.abs(bestDot) > 0.1) {
                return { fi: bestFi, d: bestDot > 0 ? 1 : -1 };
            }
            return null;
        }

        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerup', onPointerUp);
        renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
        renderer.domElement.addEventListener('wheel', e => {
            orbitRadius = Math.max(4, Math.min(30, orbitRadius + e.deltaY * 0.02)); updateCamera();
        });

        // ─── Touch ────────────────────────────────────────────────────────────────
        let touchState = null;
        renderer.domElement.addEventListener('touchstart', e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                touchState = { type: 'drag' }; const t = e.touches[0];
                onPointerDown({ clientX: t.clientX, clientY: t.clientY, button: 0 });
            } else if (e.touches.length === 2) {
                onPointerUp();
                touchState = { type: 'pinch', dist: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) };
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 1 && touchState && touchState.type === 'drag')
                onPointerMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
            else if (e.touches.length === 2 && touchState && touchState.type === 'pinch') {
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                orbitRadius = Math.max(4, Math.min(30, orbitRadius - (d - touchState.dist) * 0.06));
                updateCamera(); touchState.dist = d;
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', e => {
            if (e.touches.length === 0) { onPointerUp(); touchState = null; }
            else if (e.touches.length === 1) touchState = { type: 'drag' };
        });

        // ─── Keyboard ─────────────────────────────────────────────────────────────
        document.addEventListener('keydown', e => {
            if (cube.isAnimating || cube.solving) return;
            if (e.key === 'z' && (e.ctrlKey || e.metaKey)) cube.undoMove();
            else if (e.key === ' ') cube.scramble();
        });

        // ─── Render loop ──────────────────────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            if (cube.timerRunning) {
                cube.timerElapsed = performance.now() - cube.timerStart;
                updateTimerDisplay(cube.timerElapsed);
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        cube.build();
        animate();
    </script>
</body>

</html>
